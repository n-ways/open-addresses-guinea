openapi: "3.1.0"
info:
  title: "N-Ways Addressing for Guinea: registry API"
  version: v1
  description: "Serves the published registry of Guinea's addresses and, on the designated issuer only, issues new codes by the rules of engine/SPEC.md. Every example is a real response. See docs/api.md."
  license:
    name: "Apache-2.0 (code); the data is ODbL-1.0"
    identifier: Apache-2.0
  contact:
    name: "N-WAYS LIMITED"
    url: "https://nways.ng"
    email: "hello@nways.ng"
servers:
  - url: /
    description: "the deployment serving this document"
paths:
  /v1/health:
    get:
      operationId: health
      summary: "Liveness and the registry in use"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
              examples:
                health:
                  value:
                    status: ok
                    country: GN
                    codes: 3808784
                    registry_exported: "2026-10-21T18:50:00Z"
                    issuing: true
        "405":
          description: "Method not allowed"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                health-post:
                  value:
                    error:
                      code: method_not_allowed
                      message: "POST is not allowed here. Allowed: GET."
      security: []
  /v1/info:
    get:
      operationId: info
      summary: "Country, zones, counts, licences, credit and engine"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Info"
              examples:
                info:
                  value:
                    country: GN
                    name: Guinea
                    codes: 3808784
                    areas: 17044
                    zones:
                      - key: CKY
                        digit: 0
                        name: Conakry
                        bbox:
                          - -13.8403
                          - 9.4322
                          - -13.4738
                          - 9.7534
                        codes: 258080
                        areas: 228
                      - key: BAS
                        digit: 1
                        name: "Basse-Guinée"
                        bbox:
                          - -15.3667
                          - 9.0341
                          - -12.1101
                          - 12.6756
                        codes: 1003774
                        areas: 4951
                      - key: MOY
                        digit: 2
                        name: "Moyenne-Guinée"
                        bbox:
                          - -12.9821
                          - 9.8723
                          - -11.0508
                          - 12.4526
                        codes: 811367
                        areas: 2392
                    counts:
                      provisional: 3808784
                      confirmed: 0
                      retired: 0
                    registry_exported: "2026-10-21T18:50:00Z"
                    imported_at: "2026-10-21T19:27:04Z"
                    licences:
                      code: Apache-2.0
                      data: ODbL-1.0
                      documents: CC-BY-4.0
                    credit: "N-Ways Addressing for Guinea, © N-WAYS LIMITED (nways.ng)"
                    credit_url: "https://github.com/n-ways/open-addresses-guinea"
                    engine:
                      spec: "SPEC v1.0"
                      reference: engine/reference/gn_codes.py
                    issuing:
                      enabled: true
                      per_key_per_day: 50
                    example:
                      remembered: "Hafia 3 · 1230"
                      machine: GN-04261-1230-8
                      spot: "0 22JV PVQQ"
        "405":
          description: "Method not allowed"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                info-post:
                  value:
                    error:
                      code: method_not_allowed
                      message: "POST is not allowed here. Allowed: GET."
      security: []
  /v1/codes/{machine}:
