components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: "stable error code"
            message:
              type: string
              description: "a sentence for people"
            existing:
              "$ref": "#/components/schemas/Code"
            zone:
              type: string
            machine:
              type: string
            spot:
              type: object
              properties:
                lat:
                  type: number
                lng:
                  type: number
          required:
            - code
            - message
      required:
        - error
    Frame:
      type: object
      properties:
        key:
          type: string
          enum:
            - CKY
            - BAS
            - MOY
            - HAU
            - FOR
        digit:
          type: integer
          minimum: 0
          maximum: 4
        name:
          type: string
        bbox:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
          description: "west, south, east, north"
      required:
        - key
        - digit
        - name
        - bbox
    Zone:
      allOf:
        - "$ref": "#/components/schemas/Frame"
        - type: object
          properties:
            areas:
              type: integer
            codes:
              type: integer
            registry_file:
              type: string
    AreaSummary:
      type: object
      properties:
        zone:
          type: string
          pattern: "^[0-4]-[0-9]{5}$"
          description: "area reference, the registry's zone column"
        area_id:
          type: string
        plate_name:
          type: string
        official_name:
          type: string
        kind:
          type: string
          enum:
            - quartier
            - locality
        label:
          type: string
        place:
          type: string
        frame:
          type: string
        name_id:
          type: integer
        name_needs_council_choice:
          type: boolean
        codes:
          type: integer
    Area:
      allOf:
        - "$ref": "#/components/schemas/AreaSummary"
        - type: object
          properties:
            index:
              type: integer
            name_key:
              type: string
            lat:
              type: number
            lon:
              type: number
            blocks:
              type: array
              items:
                type: object
                properties:
                  lo:
                    type: integer
                  hi:
                    type: integer
                  size:
                    type: integer
            counts:
              type: object
              properties:
                provisional:
                  type: integer
                confirmed:
                  type: integer
                retired:
                  type: integer
                total:
                  type: integer
            numbers:
              type: object
              properties:
                in_blocks:
                  type: integer
                free:
                  type: integer
            same_name:
              type: array
              items:
                type: string
    RegistryRow:
      type: object
      properties:
        machine:
          type: string
          pattern: "^GN-[0-9]{5}-[0-9]{4,5}-[0-9]$"
        home:
          type: string
        plate:
          type: string
        zone:
          type: string
        official_name:
          type: string
        label:
          type: string
        number:
          type: integer
        check:
          type: integer
        status:
          type: string
          enum:
            - provisional
            - confirmed
            - retired
        issued:
          type: string
          enum:
            - bulk
            - on-demand
        issued_at:
          type: string
          format: date-time
        entrance_lat:
          type: number
        entrance_lng:
          type: number
        entrance_kind:
          type: string
          enum:
            - centre
            - gate
            - door
            - shopfront
            - landing
            - service
        spot:
          type: string
        plus_code:
          type: string
        class:
          type: string
        use:
          type: string
        kind:
          type: string
        structures:
          type: integer
        floor_area_m2:
          type: number
        settlement:
          type: string
        official_street:
          type: string
    Forms:
      type: object
      properties:
        remembered:
          type: string
        written:
          type: string
        plate:
          type: string
        spoken:
          type: string
        machine:
          type: string
    Code:
      allOf:
        - "$ref": "#/components/schemas/RegistryRow"
        - type: object
          properties:
            country:
              type: string
              const: GN
            forms:
              "$ref": "#/components/schemas/Forms"
            place:
              type: string
            full_line:
              type: string
            bloc:
              type: string
            area:
              "$ref": "#/components/schemas/AreaSummary"
            frame:
              "$ref": "#/components/schemas/Frame"
            registry_file:
              type: string
            credit:
              type: string
            official_address:
              type: string
            distance_m:
              type: number
            new_block:
              type: object
              properties:
                lo:
                  type: integer
                hi:
                  type: integer
    CodeSummary:
      type: object
      properties:
        machine:
          type: string
        home:
          type: string
        plate:
          type: string
        zone:
          type: string
        status:
          type: string
        entrance_lat:
          type: number
        entrance_lng:
          type: number
        entrance_kind:
          type: string
        use:
          type: string
        distance_m:
          type: number
    Health:
      type: object
      properties:
        status:
          type: string
        country:
          type: string
        codes:
          type: integer
        registry_exported:
          type: string
        issuing:
          type: boolean
    Info:
      type: object
      properties:
        country:
          type: string
        name:
          type: string
        codes:
          type: integer
        areas:
          type: integer
        zones:
          type: array
          items:
            "$ref": "#/components/schemas/Zone"
        counts:
          type: object
          properties:
            provisional:
              type: integer
            confirmed:
              type: integer
            retired:
              type: integer
        registry_exported:
          type: string
        imported_at:
          type: string
        licences:
          type: object
          properties:
            code:
              type: string
            data:
              type: string
            documents:
              type: string
        credit:
          type: string
        credit_url:
          type: string
        engine:
          type: object
          properties:
            spec:
              type: string
            reference:
              type: string
        issuing:
          type: object
          properties:
            enabled:
              type: boolean
            per_key_per_day:
              type: integer
        example:
          type: object
          properties:
            remembered:
              type: string
            machine:
              type: string
            spot:
              type: string
    Find:
      type: object
      properties:
        query:
          type: string
        kind:
          type: string
          enum:
            - remembered
            - machine
            - spot
            - official_address
        count:
          type: integer
        total:
          type: integer
        truncated:
          type: boolean
        matches:
          type: array
          items:
            "$ref": "#/components/schemas/Code"
    At:
      type: object
      properties:
        status:
          type: string
          enum:
            - found
            - none
            - outside
        lat:
          type: number
        lng:
          type: number
        frame:
          "$ref": "#/components/schemas/Frame"
        area:
          oneOf:
            - "$ref": "#/components/schemas/AreaSummary"
            - type: "null"
        distance_m:
          type: number
        code:
          "$ref": "#/components/schemas/Code"
        message:
          type: string
    Near:
      type: object
      properties:
        lat:
          type: number
        lng:
